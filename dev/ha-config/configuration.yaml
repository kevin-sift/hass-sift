default_config:

logger:
  default: info
  logs:
    custom_components.sift: debug

input_boolean:
  sift_canary:
    name: Sift canary
    initial: false

sift:
  api_uri: http://host.docker.internal:8765/api/v2/ingest
  api_key: local-test-key
  asset: hass_sift_local_test
  filter:
    include_entities:
      - input_boolean.sift_canary
  flush_interval: 0.2
  max_batch_points: 50
  runs:
    mode: rolling
    period: 24h
  forward_logs:
    enabled: true
    level: WARNING
    channel: homeassistant.log
    max_message_length: 400
